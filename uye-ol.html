
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Üye Ol | Kalite Takip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="giris-karti kayit-karti">   

    
        <h1>Hesap Oluştur</h1>

        <form>
            <div>
                <label for="adSoyad">Ad Soyad:</label>
                <input type="text" id="adSoyad"
                       placeholder="Adın Soyadın" required>
            </div>

            <div>
                <label for="email">E-posta:</label>
                <input type="email" id="email"
                       placeholder="E-posta adresin" required>
            </div>

            <div>
                <label for="sifre">Şifre:</label>
                <input type="password" id="sifre"
                       placeholder="Şifreni oluştur" required>
            </div>

            <div>
                <label for="sifreTekrar">Şifre Tekrarı:</label>
                <input type="password" id="sifreTekrar"
                       placeholder="Şifreni tekrar yaz" required>
            </div>

            <button type="submit">Üye Ol</button>

            <p>Hesabın var mı? <a href="giris.html">Giriş Yap</a></p>
        </form>
    </div>
<script src="uye-ol.js"></script>
</body>
</html>
