
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kullanıcı Girişi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

<div  class="giris-sayfasi">

<div class="tanitim-bolumu">
    <h1>Kalite Takip</h1>
    <h2>Hata Takip ve Kalite Yönetimi</h2>
    <p>Yazılım hatalarını takip edin, süreçleri yönetin ve kaliteyi geliştirin.</p>

    <h3>✓ Hata Takibi</h3>
    <h3>✓ Süreç Yönetimi</h3>
    <h3>✓ Kalite İyileştirme</h3>
    <h3>✓ Durum Kontrolü</h3>
</div>


    <div class="giris-karti">
        <h1>Kullanıcı Girişi</h1>

        <form>
            <div>
                <label for="email">E-posta:</label>
                <input type="email" id="email"
                       placeholder="E-posta adresin" required>
            </div>

            <div>
                <label for="sifre">Şifre:</label>
                <input type="password" id="sifre"
                       placeholder="Şifren" required>
                       <button type="button" id="sifreGoster">Şifreyi Göster</button>
            </div>

            <button type="submit">Giriş Yap</button>
            <p>Hesabın yok mu? <a href="uye-ol.html">Üye Ol</a></p>
        </form>
    </div>
</div>
 <script src="script.js"></script>
</body>
</html>
